<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Panel</title>

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <h1 class="mb-4">CLT Floor Panel Properties Calculator</h1>

        <div class="card">
            <div class="card-header">Input</div>
            <div class="card-body">
                <div class="row g-3 mb-3">
                    <div class="col-md-3">
                        <label class="form-label">Analytical Method</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="analyticalMethod" id="methodShearAnalogy" value="shear-analogy" checked>
                            <label class="form-check-label" for="methodShearAnalogy">Shear Analogy</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="analyticalMethod" id="methodGamma" value="gamma">
                            <label class="form-check-label" for="methodGamma">Gamma</label>
                        </div>
                        <div id="shearAnalogyHint" class="form-text">Supports 3-9 layers, symmetric layup.</div>
                        <div id="gammaHint" class="form-text d-none">Supports 3 or 5 layers only, symmetric layup.</div>
                    </div>
                    <div class="col-md-3">
                        <label for="totalLayers" class="form-label">Total Layers</label>
                        <input type="number" id="totalLayers" class="form-control" value="5" min="3" max="9">
                    </div>
                    <div class="col-md-3">
                        <label for="beff" class="form-label">beff (mm)</label>
                        <input type="number" id="beff" class="form-control" value="1000">
                    </div>
                    <div class="col-md-3">
                        <label for="length" class="form-label">Length / Span (m)</label>
                        <input type="number" id="length" class="form-control" value="5" step="0.1">
                    </div>
                </div>

                <h5>Layer Build-up</h5>
                <p class="text-muted small">Layer 1 = top face. Layup must be symmetric top-to-bottom.</p>

                <div class="row gx-2 mb-1 fw-bold text-muted small">
                    <div class="col-2">Layer</div>
                    <div class="col-3">Thickness (mm)</div>
                    <div class="col-3">Orientation</div>
                    <div class="col-4">Grade</div>
                </div>
                <div id="layersContainer"></div>

                <button id="calculateBtn" type="button" class="btn btn-primary mt-3">Calculate</button>
            </div>
        </div>

        <div id="outputSection"></div>
    </div>

    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="type/material-grade-type.js"></script>
    <script src="type/clt-layer-type.js"></script>
    <script src="type/clt-layup-type.js"></script>
    <script src="type/clt-layer-properties-type.js"></script>
    <script src="type/panel-properties-type.js"></script>
    <script src="calculation/panel-properties.js"></script>
    <script src="calculator.js"></script>
</body>
</html>
